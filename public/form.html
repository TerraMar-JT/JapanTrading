<!-- Hidden form for Netlify Forms detection at build time -->
<form name="contact" method="POST" data-netlify="true" action="/thank-you" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="title" />
  <input name="name" />
  <input name="email" />
  <input name="country" />
  <input name="company" />
  <input name="subject" />
  <textarea name="message"></textarea>
</form>

<!-- Hidden form for Netlify Forms detection at build time -->
<form name="contact" netlify netlify-honeypot="bot-field" hidden>
  <input name="title" />
  <input name="name" />
  <input name="email" />
  <input name="country" />
  <input name="company" />
  <input name="subject" />
  <textarea name="message"></textarea>
</form>
